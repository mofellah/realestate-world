name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  e2e-cypress:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: boilerplate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run generate --workspace=db

      - name: Run database migrations
        run: |
          npm run migrate:dev --workspace=db
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boilerplate_test

      - name: Seed database
        run: npm run seed --workspace=db
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boilerplate_test

      - name: Build backend
        run: |
          npm run build --workspace=@boilerplate/backend
          if [ ! -f "apps/backend/dist/apps/backend/src/main.js" ]; then
            echo "❌ Backend build failed - dist/apps/backend/src/main.js not found"
            ls -la apps/backend/dist/ || echo "dist/ directory doesn't exist"
            exit 1
          fi
          echo "✅ Backend built successfully"

      - name: Build frontend
        run: |
          npm run build --workspace=@boilerplate/frontend
          if [ ! -d "apps/frontend/dist" ]; then
            echo "❌ Frontend build failed - dist/ directory not found"
            exit 1
          fi
          echo "✅ Frontend built successfully"

      - name: Start backend server (background)
        run: |
          npm run start:prod --workspace=@boilerplate/backend > backend.log 2>&1 &
          echo $! > backend.pid
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boilerplate_test
          JWT_SECRET: test-secret-key-for-ci
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci
          REFRESH_TOKEN_SECRET: test-refresh-secret-for-ci
          PORT: 3000
          NODE_ENV: production
          FRONTEND_URL: http://localhost:4173

      - name: Start frontend server (background)
        run: |
          npm run preview --workspace=@boilerplate/frontend > frontend.log 2>&1 &
          echo $! > frontend.pid
        env:
          VITE_API_URL: http://localhost:3000

      - name: Wait for backend health
        run: |
          for i in {1..60}; do
            if curl -f http://localhost:3000/health; then
              echo "✅ Backend is ready"
              break
            fi
            echo "⏳ Waiting for backend... ($i/60)"
            if [ $i -eq 30 ]; then
              echo "📋 Backend logs:"
              cat backend.log || echo "No backend logs"
            fi
            sleep 2
          done
          if ! curl -f http://localhost:3000/health; then
            echo "❌ Backend failed to start"
            cat backend.log || echo "No backend logs"
            exit 1
          fi

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:4173; then
              echo "✅ Frontend is ready"
              break
            fi
            echo "⏳ Waiting for frontend... ($i/30)"
            sleep 2
          done

      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: chrome
          config-file: apps/frontend/cypress.config.ts
          wait-on: 'http://localhost:3000/health, http://localhost:4173'
          wait-on-timeout: 120
          record: false
        env:
          CYPRESS_BASE_URL: http://localhost:4173

      - name: Upload Cypress screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: apps/frontend/cypress/screenshots/
          retention-days: 7

      - name: Upload Cypress videos (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: apps/frontend/cypress/videos/
          retention-days: 7

      - name: Stop servers
        if: always()
        run: |
          if [ -f backend.pid ]; then kill $(cat backend.pid) || true; fi
          if [ -f frontend.pid ]; then kill $(cat frontend.pid) || true; fi

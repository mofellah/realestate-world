name: Docker Build & Push

# Trigger on releases, manual dispatch, or tags
on:
  push:
    tags:
      - 'v*.*.*'
      - 'release-*'
  workflow_dispatch:
    inputs:
      push_images:
        description: 'Push images to registry'
        required: false
        default: 'false'

env:
  NODE_VERSION: '20'
  REGISTRY: docker.io

jobs:
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository }}/backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ops/docker/backend.dockerfile
          push: false
          load: true
          tags: backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository }}/frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ops/docker/frontend.dockerfile
          push: false
          load: true
          tags: frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for database
        id: meta-db
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository }}/db
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build database image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ops/docker/db.dockerfile
          push: false
          load: true
          tags: db:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test backend image
        run: |
          docker build -f ops/docker/backend.dockerfile -t backend:test . --target=builder
          docker build -f ops/docker/backend.dockerfile -t backend:test-runtime . --target=runtime

      - name: Test frontend image
        run: |
          docker build -f ops/docker/frontend.dockerfile -t frontend:test .

      - name: Test database image
        run: |
          docker build -f ops/docker/db.dockerfile -t db:test .

      - name: Log in to Docker Registry
        if: github.event_name == 'push' || github.event.inputs.push_images == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push backend image
        if: github.event_name == 'push' || github.event.inputs.push_images == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ops/docker/backend.dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push frontend image
        if: github.event_name == 'push' || github.event.inputs.push_images == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ops/docker/frontend.dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push database image
        if: github.event_name == 'push' || github.event.inputs.push_images == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ops/docker/db.dockerfile
          push: true
          tags: ${{ steps.meta-db.outputs.tags }}
          labels: ${{ steps.meta-db.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image build summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Backend image: backend:latest" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Frontend image: frontend:latest" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Database image: db:latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images built successfully and ready for deployment" >> $GITHUB_STEP_SUMMARY

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  REGISTRY: docker.io
  IMAGE_PREFIX: realestate-world

jobs:
  build-and-push-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ops/docker/backend.dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:buildcache,mode=max

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ops/docker/frontend.dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:buildcache,mode=max

      - name: Extract metadata for database
        id: meta-db
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/db
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push database image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ops/docker/db.dockerfile
          push: true
          tags: ${{ steps.meta-db.outputs.tags }}
          labels: ${{ steps.meta-db.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/db:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/db:buildcache,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push-images
    environment:
      name: staging
      url: https://staging.realestate-world.com
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging server
        run: |
          echo "🚀 Deploying to staging environment..."
          # Add deployment script here (SSH, kubectl, AWS ECS, etc.)
          # Example: ssh deploy@staging.realestate-world.com "docker-compose pull && docker-compose up -d"

      - name: Run smoke tests
        run: |
          echo "🧪 Running smoke tests..."
          # Wait for service to be healthy
          for i in {1..30}; do
            if curl -f https://staging.realestate-world.com/health; then
              echo "✅ Staging health check passed"
              break
            fi
            echo "⏳ Waiting for staging... ($i/30)"
            sleep 5
          done

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Deployment to staging successful"
          # Add Slack notification here if needed

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Deployment to staging failed"
          # Add Slack notification here if needed

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
      url: https://realestate-world.com
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production server
        run: |
          echo "🚀 Deploying to production environment..."
          # Add deployment script here (SSH, kubectl, AWS ECS, etc.)
          # Example: ssh deploy@production.realestate-world.com "docker-compose pull && docker-compose up -d"

      - name: Run smoke tests
        run: |
          echo "🧪 Running smoke tests..."
          # Wait for service to be healthy
          for i in {1..30}; do
            if curl -f https://realestate-world.com/health; then
              echo "✅ Production health check passed"
              break
            fi
            echo "⏳ Waiting for production... ($i/30)"
            sleep 5
          done

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Deployment to production successful"
          # Add Slack notification here if needed
          # Example: curl -X POST -H 'Content-type: application/json' --data '{"text":"✅ Deployed to production"}' ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Deployment to production failed"
          # Add Slack notification here if needed
          # Example: curl -X POST -H 'Content-type: application/json' --data '{"text":"❌ Production deployment failed"}' ${{ secrets.SLACK_WEBHOOK_URL }}

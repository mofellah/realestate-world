services:
  # =========================================
  # PostgreSQL Database with PostGIS
  # =========================================
  db:
    build:
      context: ../..
      dockerfile: ops/docker/db.dockerfile
    container_name: realestate_db_prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"  # Only localhost in production
    volumes:
      - postgres_data_prod:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - realestate_prod
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  # =========================================
  # NestJS Backend (Production)
  # =========================================
  backend:
    build:
      context: ../..
      dockerfile: ops/docker/backend.dockerfile
      target: runtime
    container_name: realestate_backend_prod
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      REFRESH_TOKEN_EXPIRATION: ${REFRESH_TOKEN_EXPIRATION:-604800}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - realestate_prod
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 512M

  # =========================================
  # React Frontend (Nginx Serving Static Build)
  # =========================================
  frontend:
    build:
      context: ../..
      dockerfile: ops/docker/frontend.dockerfile
      target: runtime
    container_name: realestate_frontend_prod
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - realestate_prod
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # =========================================
  # Nginx Reverse Proxy (Production Gateway)
  # =========================================
  nginx:
    build:
      context: ../..
      dockerfile: ops/docker/nginx-proxy.dockerfile
    container_name: realestate_nginx_prod
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../ops/docker/nginx-proxy.conf:/etc/nginx/nginx.conf:ro
      # Uncomment when SSL certificates are available
      # - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - realestate_prod
    restart: always

volumes:
  postgres_data_prod:

networks:
  realestate_prod:
    driver: bridge

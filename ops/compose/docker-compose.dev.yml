services:
  # =========================================
  # PostgreSQL Database with PostGIS
  # =========================================
  db:
    build:
      context: ../..
      dockerfile: ops/docker/db.dockerfile
    container_name: realestate_db_dev
    environment:
      POSTGRES_DB: ${DB_NAME:-realestate}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - realestate_dev
    restart: unless-stopped

  # =========================================
  # NestJS Backend (Development with hot reload)
  # =========================================
  backend:
    build:
      context: ../..
      dockerfile: ops/docker/backend.dev.dockerfile
    container_name: realestate_backend_dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-realestate}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_32_chars_minimum_123456}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-dev_refresh_secret_32_chars_min_123456}
      REFRESH_TOKEN_EXPIRATION: ${REFRESH_TOKEN_EXPIRATION:-604800}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      PORT: 3000
    ports:
      - "${BACKEND_PORT:-3000}:3000"
      - "9229:9229"  # Node.js debugger port
    volumes:
      # Mount source for hot-reload
      - ../../apps/backend/src:/app/apps/backend/src
      # Preserve node_modules to prevent conflicts
      - backend_node_modules:/app/node_modules
    command: sh -c "npm rebuild bcrypt --build-from-source --workspace=@boilerplate/utils && npm run prisma:migrate:deploy && cd apps/backend && npm run dev"
    networks:
      - realestate_dev
    restart: unless-stopped

  # =========================================
  # React Frontend (Vite Dev Server with HMR)
  # =========================================
  frontend:
    build:
      context: ../..
      dockerfile: ops/docker/frontend.dev.dockerfile
    container_name: realestate_frontend_dev
    depends_on:
      - backend
    environment:
      NODE_ENV: development
      VITE_API_URL: ${VITE_API_URL:-http://backend:3000}
      VITE_HMR_HOST: localhost
      VITE_HMR_PORT: 5173
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      # Mount source for hot-reload
      - ../../apps/frontend/src:/app/apps/frontend/src
      - ../../apps/frontend/public:/app/apps/frontend/public
      - ../../apps/frontend/index.html:/app/apps/frontend/index.html
      - ../../apps/frontend/vite.config.ts:/app/apps/frontend/vite.config.ts
      - ../../apps/frontend/tailwind.config.js:/app/apps/frontend/tailwind.config.js
      - ../../apps/frontend/postcss.config.js:/app/apps/frontend/postcss.config.js
    networks:
      - realestate_dev
    restart: unless-stopped

  # =========================================
  # Tegola Vector Tile Server
  # =========================================
  tegola:
    image: gospatial/tegola:v0.18.0
    container_name: realestate_tegola_dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Tegola uses config file for DB connection
      NO_COLOR: "true"
    ports:
      - "8081:8080"
    volumes:
      - ../tegola/config.toml:/opt/tegola_config/config.toml:ro
    command: serve --config /opt/tegola_config/config.toml
    networks:
      - realestate_dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/capabilities"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data_dev:
  backend_node_modules:
  backend_dist:

networks:
  realestate_dev:
    driver: bridge
